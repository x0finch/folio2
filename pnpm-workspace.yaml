packages:
  - "packages/*"
  - "packages/clients/*"
  - "packages/connectors/*"
  - "packages/oracle/*"
  - "packages/oracle/upstreams/*"
  - "apps/*"

# A dependency used by 2+ packages is written here once; packages say `catalog:`.
# Single-consumer deps stay out. `packages/ui` keeps its wider peer `react: ^19.0.0` on purpose:
# a peer range says what it works with, not what is installed.
catalog:
  "@cloudflare/vitest-pool-workers": ^0.16.20
  "@cloudflare/workers-types": ^4.20260626.1
  "@effect/platform": ^0.97.1
  "@types/node": ^22.20.0
  "@types/react": ^19.2.17
  "@types/react-dom": ^19.2.3
  # Must match the vitest version exactly; bump together.
  "@vitest/coverage-istanbul": 4.1.9
  better-auth: ^1.6.25
  effect: ^3.22.1
  jsdom: ^28.1.0
  lucide-react: ^0.545.0
  motion: ^12.42.2
  react: ^19.2.0
  react-dom: ^19.2.7
  recharts: 3.8.0
  typescript: ^7.0.2
  vitest: ^4.1.9
  wrangler: ^4.105.0
  zod: ^4.0.0
