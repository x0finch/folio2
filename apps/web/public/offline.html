<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Folio — Offline</title>
    <style>
      /* 自包含、无外链:SW 缓存的兜底页,离线时也必须能独立渲染。深色对齐 App。 */
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 1rem; padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        background: #0a0a0a; color: #fafafa; text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
      p { margin: 0; max-width: 22rem; color: #a1a1a1; font-size: 0.9rem; line-height: 1.5; }
      button {
        margin-top: 0.5rem; padding: 0.6rem 1.4rem; border: 0; border-radius: 0.6rem;
        background: #fafafa; color: #0a0a0a; font: inherit; font-weight: 600; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>You're offline</h1>
    <p>
      Folio shows live balances, so it needs a connection. Your data isn't shown here — reconnect
      to see up-to-date numbers.
    </p>
    <button type="button" onclick="location.reload()">Try again</button>
  </body>
</html>
