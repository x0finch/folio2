name: Ref index refresh

# Daily refresh of `global_token_ref_index` (on-chain contract to CoinGecko name) into the production D1.
#
# Runs here, not in the Worker's 23:00 cron: that pass fetches a 2.6 MB coin catalog and diffs tens of thousands of rows, costing 480-520ms CPU (exceededCpu 2 of 7 runs) against the free plan's 10ms. Actions runners have no such cap; the logic is unchanged (same `GlobalRefIndexService` + `putAll` diff write), only the connection is the D1 REST API instead of the binding. Script: apps/web/scripts/ref-index/refresh.ts.
#
# Needs the repo secret `CLOUDFLARE_API_TOKEN` (the one from deploy.yml: Workers Scripts:Edit + D1:Edit); optional `COINGECKO_API_KEY` (keyless quota is enough, this run makes two calls).
#
# Schedules routinely run 10-60 minutes late and occasionally skip; this cache tolerates a day of lag. To backfill, run it manually from Actions. GitHub also disables schedules after 60 days without commits in a public repo, and schedules only run on the default branch.
on:
  schedule:
    - cron: "0 23 * * *" # UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the diff and print counts; write nothing"
        type: boolean
        default: false

# Read-only on the code; writes go to Cloudflare, not this repo.
permissions:
  contents: read

# One run at a time: concurrent runs would each diff against the old table and double-write. In-flight runs aren't cancelled.
concurrency:
  group: ref-index-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Failure (upstream / D1 / token) exits non-zero and fails the run. The token enters only via env and request headers; the script never prints it.
      - name: Refresh global_token_ref_index (remote D1)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: pnpm --filter @folio/web run ref-index:refresh $DRY_RUN_FLAG
