name: Deploy

# Release deploy, triggered two ways:
#   1) pushing a v* tag (`git tag v1.2.0 && git push origin v1.2.0`).
#   2) GitHub UI / mobile: Actions, Deploy, Run workflow with a version (workflow_dispatch); CI pushes the tag first (needs contents:write), then verifies, migrates and deploys as usual.
#      If tags are protected, add github-actions to the bypass list or the tag push gets 403.
#      A tag pushed by GITHUB_TOKEN does not retrigger the push:tags trigger, so no double deploy.
# Needs the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts:Edit + D1:Edit). account_id is in apps/web/wrangler.jsonc; runtime secrets (SECRETS_KEY etc.) are set once with `wrangler secret put` and stored in the Worker. See apps/web/DEPLOY.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version like v0.14.1 (CI tags it)"
        required: true
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false # don't cancel an in-flight deploy: it could leave inconsistent state

jobs:
  # Only for workflow_dispatch: pushes the input version as a tag so `git describe` in the jobs below gets it. Skipped on tag triggers (verify handles both via `needs.tag.result`).
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushing a tag needs write
    steps:
      - name: Validate version
        run: |
          echo "${{ inputs.version }}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Version must look like v0.14.1 (v + three numbers)"; exit 1; }
      - uses: actions/checkout@v7
      - name: Create & push tag
        run: |
          git tag "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

  # Re-run the gates before deploy, in case the tag landed on a commit that never passed CI.
  verify:
    needs: tag
    # On tag triggers the tag job is skipped and this runs; on dispatch it waits for the tag; if tagging fails (e.g. invalid version) it doesn't run.
    if: ${{ always() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so vite's git describe yields the real version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm test:packages
      - run: pnpm --filter @folio/web test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    # Deploy history; for a manual approval gate, configure required reviewers under Settings, Environments, production.
    environment: production
    permissions:
      contents: write # creating a GitHub Release needs write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so vite's git describe yields the real version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrate remote D1 first: if it fails the job stops before deploy, so code never ships without its schema. Destructive migrations can't be rolled back; review them before release (see DEPLOY.md).
      - name: Apply D1 migrations (remote)
        run: pnpm --filter @folio/web run db:migrate:remote

      # Must use `run deploy`: bare `pnpm deploy` hits pnpm's built-in deploy command.
      - name: Build & deploy
        run: pnpm --filter @folio/web run deploy

      # Recompute the daily rollup (`account_daily_totals`) from all snapshots: snapshots written by old code between migration and deploy didn't maintain it. Idempotent INSERT OR REPLACE. Statement taken from migration 0009 (apps/web/scripts/backfill-daily-totals.mjs).
      - name: Backfill daily totals
        run: pnpm --filter @folio/web run db:backfill-daily-totals

      # Create a GitHub Release for this version after a successful deploy (auto-generated notes). The version comes from the input (dispatch) or ref_name (tag); skipped if it already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping."
          else
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
