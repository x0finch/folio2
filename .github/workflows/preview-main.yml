name: Preview (main)

# Keeps the fixed preview domain `preview.folio.009003.xyz` at the latest main: every merge to main is promoted to the preview Worker's active deployment. The other half of the deployment-vs-version model is pr-preview.yml's per-PR version aliases; both share one folio-preview Worker + D1, and promoting main doesn't affect uploaded PR versions. Production `folio` is untouched (it deploys via tag, deploy.yml). Reuses the production CLOUDFLARE_API_TOKEN.
on:
  push:
    branches: [main]

# Shares pr-preview's concurrency group so main deploys and PR version uploads serialise (shared D1 migrations, one Worker); in-flight deploys aren't cancelled.
concurrency:
  group: pr-preview
  cancel-in-progress: false

jobs:
  preview-main:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrate the preview remote DB first (fail-stop, same as pr-preview / production).
      - name: Apply D1 migrations (preview)
        run: pnpm --filter @folio/web run db:migrate:preview

      # vite build + wrangler deploy --env preview: promote to the active deployment so the fixed domain tracks main.
      - name: Build & deploy preview (main)
        run: pnpm --filter @folio/web run deploy:preview
