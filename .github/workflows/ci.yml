name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Two jobs, not five. Everything here is CPU-bound compilation on a 2-core
# runner, so spreading the work over more machines is the only real lever —
# but Actions bills each job rounded UP to the whole minute, so more jobs cost
# more even when the total work is unchanged. `test` is now the only slow part
# (~99s; tsc stopped mattering once TypeScript 7 landed), so a third job would
# buy ~30s of wall clock for a whole extra billed minute. Not worth it — check
# that trade again before splitting further.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm using the version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
