name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job, measured. Everything here is CPU-bound compilation on a 2-core
# runner, so spreading it over more machines is the only lever on wall clock —
# but Actions bills each job rounded UP to the whole minute, and that rounding
# is what decides the trade here. Measured on this repo:
#
#   one job        ~137s wall  →  3 billed minutes
#   two jobs        129s wall  →  4 billed minutes  (checks 39s→1, test 125s→3)
#
# Splitting bought 8s of wall clock for a whole extra minute, because `test`
# lands at ~125s — five seconds past the 2-minute line, so it rounds to 3
# either way. Not worth it.
#
# Before splitting again, the thing to attack is `test` (~97s), which is the
# only slow step left since TypeScript 7 made tsc cheap (typecheck: 63s → 9s).
# Most of that 97s is transpile + environment setup, not assertions — the
# 1121 tests themselves run in ~5s.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm using the version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheapest first, so a red PR fails as early as it can.
      - run: pnpm exec biome ci
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm test
