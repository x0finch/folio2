name: Preview DB Reset

# Manual rebuild of the shared preview DB (fallback). Normally unused: run it when a destructive migration (drop/alter column) breaks preview and the schema has drifted irrecoverably. It wipes ALL preview data (accounts, snapshots, sessions), then re-migrates fully from main's drizzle/.
#
# Touches only `folio-preview` (env.preview), never production `folio`.
#
# Caution: the drop-all SQL/jq below hasn't been verified on real D1 yet. Watch the first run's log for FK / PRAGMA errors; if wrangler's --json banner breaks jq parsing, use the manual fallback in DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET to confirm wiping the preview DB'
        required: true
        default: ''

jobs:
  reset:
    if: github.event.inputs.confirm == 'RESET'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # 1) Drop all business tables + d1_migrations (logic in scripts/reset-preview-db.mjs), via a package.json script like ci.yml/deploy.yml so knip sees it.
      - name: Drop all tables in preview DB
        run: pnpm run db:reset:preview

      # 2) Full re-migration (empty DB, build all tables from drizzle/).
      - name: Re-apply all migrations
        run: pnpm run db:migrate:preview
