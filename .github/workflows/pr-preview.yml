name: PR Preview

# On-demand preview: only PRs labelled `preview` deploy, and the URL is posted back to the PR. Removing the label stops deploys. (A label named `preview` must exist.)
#
# Deploys to a separate Worker `folio-preview` (env.preview in apps/web/wrangler.jsonc); production `folio` is untouched. Each labelled PR gets its own workers.dev preview URL via `wrangler versions upload --preview-alias pr-<N>`; PRs don't overwrite each other and share one preview Worker and one persistent `folio-preview` remote D1. Reset it manually with preview-reset.yml if a destructive migration breaks it.
# Login: preview allows the alias domains (PREVIEW_TRUSTED_ORIGINS); use email/password, since passkeys are bound to a fixed domain.
#
# The correctness gates run in ci.yml on the same commit; this only runs the preview. Reuses the production CLOUDFLARE_API_TOKEN.
#
# Triggers: labeled, synchronize, reopened. Deliberately not opened: opening a PR doesn't deploy.
on:
  pull_request:
    types: [labeled, synchronize, reopened]

# All PRs share one preview Worker + DB, so deploys are serialised globally; in-flight deploys/migrations aren't cancelled, to avoid a half-migrated DB.
concurrency:
  group: pr-preview
  cancel-in-progress: false

jobs:
  preview:
    # Only PRs labelled `preview` (skipped if the label was removed). Fork PRs get no repo secrets, so they're skipped too.
    if: >-
      contains(github.event.pull_request.labels.*.name, 'preview')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post/update the preview URL comment
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history + tags so vite's git describe yields the real version
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Migrate the preview remote DB first (fail-stop, same as production). Migrations accumulate on the shared DB and are never reset.
      - name: Apply D1 migrations (preview)
        run: pnpm --filter @folio/web run db:migrate:preview

      # Upload a version with a per-PR alias `pr-<N>` (not promoted to the fixed domain, so other PRs are untouched); the alias preview URL is scraped from wrangler's output.
      - name: Build & upload preview version
        id: deploy
        env:
          PREVIEW_ALIAS: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          pnpm --filter @folio/web run upload:preview 2>&1 | tee /tmp/wrangler.log
          url="$(grep -oiE 'https://pr-[0-9]+-folio-preview[a-z0-9.-]*\.workers\.dev' /tmp/wrangler.log | head -1)"
          if [ -z "$url" ]; then echo "::error::could not parse preview URL from wrangler output"; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          # Full build version (as in the settings footer). The alias URL is fixed and `commit` is a temporary merge sha, so the comment would look unchanged; this changes on every push.
          version="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Deploy time (to the second, UTC): a visible "just updated" stamp per push.
          echo "deployed_at=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_OUTPUT"

      # One sticky comment, updated on every push. Uses first-party github-script, no third-party action.
      - name: Upsert preview URL comment
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            const version = "${{ steps.deploy.outputs.version }}";
            const deployedAt = "${{ steps.deploy.outputs.deployed_at }}";
            // In pull_request events context.sha is a temporary merge commit, so use the head sha.
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const marker = "<!-- pr-preview-url -->";
            const body = `${marker}\n🚀 **Preview deployed**: ${url}\n\n` +
              `- This PR's own preview URL (\`pr-<N>\` alias); doesn't overwrite other PRs and can be live alongside them.\n` +
              `- Separate Worker \`folio-preview\`, production unaffected; all PRs share one preview DB, data is kept and never cleared per run.\n` +
              `- Log in with **email/password** (passkeys don't work on alias domains); see DEPLOY.md "PR preview".\n` +
              `- commit \`${sha}\` · version \`${version}\`\n` +
              `- updated \`${deployedAt}\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
